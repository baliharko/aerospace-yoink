name: CI

on:
  # Every PR, including ones stacked on another PR's branch
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --strict

  build:
    # The tests need macOS 26 at runtime (NSGlassEffectView)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26'
      - run: swift build
      - run: swift test
